name: ghasha - SHA and BRANCH
description: Compute SHA, SHORT_SHA and BRANCH (event-aware) and expose them as env vars and step outputs.
author: begoon

branding:
  icon: git-commit
  color: blue

inputs:
  length:
    description: Number of characters to keep in SHORT_SHA. Must be a positive integer.
    required: false
    default: "8"

outputs:
  sha:
    description: Full commit SHA. PR head on pull_request[_target]; github.sha elsewhere (incl. merge_group).
    value: ${{ steps.compute.outputs.sha }}
  short_sha:
    description: First N characters of SHA, where N is the `length` input.
    value: ${{ steps.compute.outputs.short_sha }}
  branch:
    description: Branch name on push/PR; tag name on tag push; target branch on merge_group.
    value: ${{ steps.compute.outputs.branch }}
  is_tag:
    description: "'true' when the workflow is running on a tag ref, otherwise 'false'."
    value: ${{ steps.compute.outputs.is_tag }}

runs:
  using: composite
  steps:
    - id: compute
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        PUSH_SHA: ${{ github.sha }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_REF_TYPE: ${{ github.ref_type }}
        LENGTH: ${{ inputs.length }}
      run: |
        set -eu

        if ! [[ "$LENGTH" =~ ^[1-9][0-9]*$ ]]; then
          echo "ghasha: 'length' must be a positive integer (got: '$LENGTH')" >&2
          exit 1
        fi

        case "$EVENT_NAME" in
          pull_request|pull_request_target)
            SHA="$PR_HEAD_SHA"
            BRANCH="$GITHUB_HEAD_REF"
            ;;
          merge_group)
            SHA="$PUSH_SHA"
            BRANCH="${MERGE_GROUP_BASE_REF#refs/heads/}"
            ;;
          *)
            SHA="$PUSH_SHA"
            BRANCH="$GH_REF_NAME"
            ;;
        esac

        SHORT_SHA="${SHA:0:$LENGTH}"

        if [ "$GH_REF_TYPE" = "tag" ]; then
          IS_TAG="true"
        else
          IS_TAG="false"
        fi

        {
          echo "SHA=$SHA"
          echo "SHORT_SHA=$SHORT_SHA"
          echo "BRANCH=$BRANCH"
          echo "IS_TAG=$IS_TAG"
        } >> "$GITHUB_ENV"

        {
          echo "sha=$SHA"
          echo "short_sha=$SHORT_SHA"
          echo "branch=$BRANCH"
          echo "is_tag=$IS_TAG"
        } >> "$GITHUB_OUTPUT"

        echo "SHA=$SHA"
        echo "SHORT_SHA=$SHORT_SHA"
        echo "BRANCH=$BRANCH"
        echo "IS_TAG=$IS_TAG"
